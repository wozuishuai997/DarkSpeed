name: Build Test IPA

on:
  workflow_dispatch:
  push:
    branches:
      - codex/clock-top-positions

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned test IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Build IPA
        env:
          DARKSPEED_UNSIGNED: '1'
        run: ./build-darkspeed.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DarkSpeed-test-${{ github.run_number }}
          path: packages/DarkSpeed_*.ipa
          if-no-files-found: error
          retention-days: 14
